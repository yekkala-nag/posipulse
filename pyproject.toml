[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "positive-news-app"
version = "0.1.0"
description = "Multi-Agent Multilingual Positive News App"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning"
]
