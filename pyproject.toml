[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "positive-news-app"
version = "0.1.0"
description = "Multi-Agent Multilingual Positive News App"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-core>=2.27.0",
    "PyYAML>=6.0.2",
    "feedparser>=6.0.11",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "email-validator>=2.2.0",
    "python-dateutil>=2.9.0",
    "numpy>=2.0.0",
    "starlette>=0.40.0",
    "anyio>=4.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning"
]
